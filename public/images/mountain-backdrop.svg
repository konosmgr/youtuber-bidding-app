<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Noise filter -->
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="3" seed="2" />
      <feComponentTransfer>
        <feFuncR type="discrete" tableValues="0 0.02" />
        <feFuncG type="discrete" tableValues="0 0.02" />
        <feFuncB type="discrete" tableValues="0 0.02" />
      </feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)" />
  
  <!-- Distant mountains (back) -->
  <path d="M0,400 L0,250 Q200,180 400,250 Q600,300 800,220 Q1000,180 1200,250 L1200,400 Z" 
        fill="#1f2937" opacity="0.7" />
  
  <!-- Middle mountains -->
  <path d="M0,400 L0,280 Q150,200 300,280 Q450,350 600,260 Q800,200 1000,300 Q1100,350 1200,280 L1200,400 Z" 
        fill="#1a2234" opacity="0.8" />
  
  <!-- Close mountains (front) -->
  <path d="M0,400 L0,320 Q100,260 250,320 Q400,380 550,300 Q700,230 850,330 Q1000,400 1200,330 L1200,400 Z" 
        fill="#0f1729" opacity="0.9" />
  
  <!-- Noise overlay -->
  <rect width="1200" height="400" fill="white" opacity="0.03" filter="url(#noise)" />
</svg> 